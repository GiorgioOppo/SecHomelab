# MISP e Splunk Enterprise per Podman rootless.
# Architettura corrente: misp-core (PHP-FPM) + misp-nginx (HTTPS).
# Prima dell'avvio: python3 init.py
services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Eseguire python3 init.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Eseguire python3 init.py}
      TZ: ${TZ:-Europe/Rome}
    command:
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-512M}
      - --innodb-change-buffering=none
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  redis:
    # Valkey è la cache compatibile Redis usata da MISP upstream.
    image: docker.io/valkey/valkey:7.2
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Eseguire python3 init.py}
    command:
      - /bin/sh
      - -ec
      - 'exec valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" valkey-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:${MODULES_RUNNING_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Rome}
    healthcheck:
      test: [CMD, /bin/bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/6666']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  mail:
    image: ghcr.io/egos-tech/smtp:1.1.3
    restart: unless-stopped
    environment:
      SMARTHOST_ADDRESS: ${SMARTHOST_ADDRESS:-}
      SMARTHOST_PORT: ${SMARTHOST_PORT:-587}
      SMARTHOST_USER: ${SMARTHOST_USER:-}
      SMARTHOST_PASSWORD: ${SMARTHOST_PASSWORD:-}
      SMARTHOST_ALIASES: ${SMARTHOST_ALIASES:-}
      TZ: ${TZ:-Europe/Rome}

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:${CORE_RUNNING_TAG:-latest}
    restart: unless-stopped
    cap_add:
      - AUDIT_WRITE
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      misp-modules:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      BASE_URL: ${BASE_URL:?Eseguire python3 init.py}
      TZ: ${TZ:-Europe/Rome}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Eseguire python3 init.py}
      ADMIN_ORG: ${ADMIN_ORG:-MISP}
      MISP_EMAIL: ${MISP_EMAIL:-admin@localhost.test}
      MISP_CONTACT: ${ADMIN_EMAIL:-admin@localhost.test}
      GPG_PASSPHRASE: ${GPG_PASSPHRASE:?Eseguire python3 init.py}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Eseguire python3 init.py}
      DISABLE_PRINTING_PLAINTEXT_CREDENTIALS: "true"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Eseguire python3 init.py}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Eseguire python3 init.py}
      ENABLE_REDIS_EMPTY_PASSWORD: "false"
      MISP_MODULES_FQDN: http://misp-modules
      SMTP_FQDN: mail
      SMTP_PORT: "25"
      FASTCGI_LISTEN_STATUS: misp-core:9003
      PHP_SESSION_COOKIE_SECURE: "true"
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-2048M}
      NUM_WORKERS_DEFAULT: ${NUM_WORKERS_DEFAULT:-2}
      NUM_WORKERS_PRIO: ${NUM_WORKERS_PRIO:-2}
      NUM_WORKERS_EMAIL: ${NUM_WORKERS_EMAIL:-1}
      NUM_WORKERS_UPDATE: "1"
      NUM_WORKERS_CACHE: ${NUM_WORKERS_CACHE:-2}
    volumes:
      - misp_config:/var/www/MISP/app/Config
      - misp_files:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs
      - misp_gnupg:/var/www/MISP/.gnupg
    healthcheck:
      test: [CMD, /bin/bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9002']
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30

  misp-nginx:
    # Core e Nginx devono usare una release compatibile della nuova architettura.
    image: ghcr.io/misp/misp-docker/misp-nginx:${CORE_RUNNING_TAG:-latest}
    restart: unless-stopped
    depends_on:
      misp-core:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    environment:
      BASE_URL: ${BASE_URL:?Eseguire python3 init.py}
      TZ: ${TZ:-Europe/Rome}
      FASTCGI_LISTEN: misp-core:9002
      FASTCGI_LISTEN_STATUS: misp-core:9003
      NGINX_SET_REAL_IP_FROM: ""
      NGINX_CONTENT_SECURITY_POLICY: ""
      NGINX_HSTS_MAX_AGE: ""
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
    volumes:
      # Mount dei singoli file: la cartella ssl può restare privata (0700).
      - ./ssl/cert.pem:/etc/nginx/certs/cert.pem:ro,Z
      - ./ssl/key.pem:/etc/nginx/certs/key.pem:ro,Z
    tmpfs:
      # Il provider Docker Compose tramite API Podman non accetta uid/gid.
      # Sticky bit e scrittura consentita permettono l'avvio come UID 101.
      - /etc/nginx/conf.d:mode=1777
      - /var/cache/nginx:mode=1777
      - /tmp:mode=1777
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Healthcheck HTTP sulla porta interna 8081 già incluso nell'immagine.

  splunk:
    image: ${SPLUNK_IMAGE:-docker.io/splunk/splunk:10.4.3}
    # L'immagine ufficiale Enterprise è x86-64; su Apple Silicon usa QEMU.
    platform: linux/amd64
    hostname: splunk
    restart: unless-stopped
    environment:
      SPLUNK_ROLE: splunk_standalone
      # Modalità di provisioning documentata dall'immagine per Podman.
      KUBERNETES_SERVICE_HOST: kubernetes
      # Espone una CPU con AVX/SSE4.2/AES-NI riconosciuta dai precheck Splunk.
      QEMU_CPU: Haswell-v4
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Eseguire python3 init.py}
      # Compilare in .env soltanto dopo aver accettato i termini Splunk.
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:-}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:-}
      # CA pubbliche + certificato MISP, preparati da splunk_setup.py.
      SSL_CERT_FILE: /opt/splunk/etc/auth/misp-ca-bundle.pem
      # Il provisioning cambia utente via sudo: riapplica queste variabili
      # dopo il cambio utente anche al processo Splunk effettivo.
      SPLUNK_ANSIBLE_ENV: QEMU_CPU=Haswell-v4,SSL_CERT_FILE=/opt/splunk/etc/auth/misp-ca-bundle.pem
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${SPLUNK_BIND_ADDRESS:-127.0.0.1}:${SPLUNK_WEB_PORT:-8000}:8000"
      - "${SPLUNK_BIND_ADDRESS:-127.0.0.1}:${SPLUNK_API_PORT:-8089}:8089"
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
    healthcheck:
      test: [CMD, /sbin/checkstate.sh]
      interval: 30s
      timeout: 30s
      # L'inizializzazione sotto emulazione può richiedere diversi minuti.
      start_period: 10m
      retries: 10

volumes:
  mysql_data:
  redis_data:
  misp_config:
  misp_files:
  misp_logs:
  misp_gnupg:
  splunk_etc:
  splunk_var:
